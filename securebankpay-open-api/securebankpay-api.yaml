  /v1/payments/{paymentUuid}/bankpayrefund:
    post:
      summary: Request a refund
      description: Request a refund for a settled Bank Pay payment.
      tags:
      - Refunds
      operationId: bankPayRefundRequest
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: paymentUuid
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the original payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: bankPayRefund
              type: object
              properties:
                currency:
                  type: string
                  enum:
                  - EUR
                  - GBP
                amount:
                  type: integer
                  format: int64
                myRef:
                  type: string
                description:
                  type: string
                orderDetails:
                  type: object
                  properties:
                    merchantNumber:
                      type: string
                reason:
                  type: string
      responses:
        '200':
          description: Refund request accepted or rejected
          content:
            application/json:
              schema:
                title: bankPayRefundResponse
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - REJECTED
                    - RECEIVED
                  refundRequestUuid:
                    type: string
                    format: uuid
                  paymentUuid:
                    type: string
                    format: uuid
        '405':
          description: The request could not be processed.
          content:
            application/json:
              schema:
                title: apiErrors
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      title: apiError
                      type: object
                      properties:
