        country:
          title: country
          type: object
          properties:
            code:
              type: string
            description:
              type: string
        currency:
          title: currency
          type: object
          properties:
            code:
              type: string
              enum:
              - EUR
              - GBP
            description:
              type: string
        dateCreated:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
    Aspsps:
