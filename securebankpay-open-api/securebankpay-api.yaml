          format: int64
        expiry:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
        accessToken:
          type: string
    ApiError:
      title: apiError
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
    ApiErrors:
      title: apiErrors
      type: object
      properties:
        errors:
          type: array
          items:
            title: apiError
            type: object
            properties:
              code:
                type: integer
                format: int64
              message:
                type: string
    Currency:
      title: currency
      type: object
      properties:
        code:
          type: string
          enum:
          - EUR
          - GBP
        description:
