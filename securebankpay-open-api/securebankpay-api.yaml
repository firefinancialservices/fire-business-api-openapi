      properties:
        total:
          type: integer
        aspsps:
          type: array
          items:
            title: aspsp
            type: object
            properties:
              aspspUuid:
                type: string
                format: uuid
              alias:
                type: string
              logoUrl:
                type: string
                format: uri
                example: https://assets.securebankpay.com/pisp/aib.svg
              country:
                title: country
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
              currency:
                title: currency
                type: object
                properties:
                  code:
