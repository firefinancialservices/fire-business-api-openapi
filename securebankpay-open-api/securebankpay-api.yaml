webhooks:
  paymentEvents:
    post:
      summary: Receive Bank Pay payment events
      description: Bank Pay sends signed JWT event notifications to the merchant webhook
        URL.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/jwt:
            schema:
              type: string
      responses:
        '200':
          description: Return HTTP 200 after the event has been received.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Access Token
  responses:
    ApiErrorResponse:
      description: The request could not be processed.
      content:
        application/json:
          schema:
            title: apiErrors
            type: object
            properties:
              errors:
                type: array
                items:
                  title: apiError
                  type: object
                  properties:
                    code:
                      type: integer
                      format: int64
                    message:
                      type: string
  schemas:
    AuthenticationData:
      title: authentication
      type: object
      required:
      - clientId
      - refreshToken
      - nonce
      - grantType
      - clientSecret
      properties:
        clientId:
          type: string
          description: The Client ID for the API application.
        refreshToken:
          type: string
          description: The Refresh Token for the API application.
        nonce:
          type: integer
          format: int64
          description: A random, non-repeating number used to create the client secret.
        grantType:
          type: string
          enum:
          - AccessToken
        clientSecret:
          type: string
          description: SHA256 of the nonce concatenated with the application Client
            Key.
    AccessToken:
      title: accessToken
      type: object
      properties:
        businessId:
          type: integer
          format: int64
        apiApplicationId:
